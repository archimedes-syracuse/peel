exec_once=/home/nimd/.local/bin/wallpaper-restore
exec_once=qs -n -c niri
exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# Do not blank the monitor: sleep_monitor does not wake on input.
exec_once=swayidle -w timeout 120 'swaylock -f' before-sleep 'swaylock -f'

monitor_rule=name:^eDP-1$,scale:1,primary:1

repeat_rate=30
repeat_delay=500
numlock_on=0
xkb_rules_layout=us

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0

mouse_natural_scrolling=0
cursor_size=24

# 1px keeps the border grab strip alive; border_px=0 disables it.
border_px=1
border_color=0x00000000
focus_color=0x00000000
maximized_screen_color=0x00000000
urgent_color=0x00000000
scratchpad_color=0x00000000
global_color=0x00000000
overlay_color=0x00000000
split_color=0x00000000
border_radius=0
no_radius_when_single=1
no_border_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0
dim_enable=0

shadows=1
layer_shadows=0
shadow_only_floating=1
shadows_size=18
shadows_blur=18
shadows_position_x=0
shadows_position_y=4
shadows_color=0x00000066

blur=0
blur_layer=0

enable_border_resize=1
border_resize_size=4
device_rule=type:trackpad,tap_to_click:1,drag_lock:1

gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8
smart_gaps=0

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_duration_open=180
animation_duration_close=160
animation_duration_move=200
animation_duration_tag=200
animation_duration_focus=0
tag_animation_direction=1

tag_num=5
new_is_master=1
default_master_count=1
default_master_factor=0.55
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1

tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle

focus_on_activate=1
sloppy_focus=0
warp_cursor=0
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=20
drag_tile_to_tile=1
drag_tile_small=1
allow_lock_transparent=0
allow_shortcuts_inhibit=1
xwayland_persistence=1
sync_obj_enable=1
auto_reload_config=1
axis_bind_apply_timeout=100

window_rule=is_floating:1,app_id:.*
window_rule=is_floating:1,app_id:^pavucontrol$
window_rule=is_floating:1,app_id:^org\.pulseaudio\.pavucontrol$
window_rule=is_floating:1,app_id:^nm-connection-editor$
window_rule=is_floating:1,app_id:^blueman-manager$
window_rule=is_floating:1,title:^Open File$

bind=SUPER,Return,spawn,alacritty
bind=SUPER,D,spawn,qs -c niri ipc call shell toggleLauncher
bind=SUPER,Escape,spawn,qs -c niri ipc call shell togglePower
bind=SUPER+SHIFT,N,spawn,qs -c niri ipc call shell toggleNotifications
bind=SUPER+SHIFT,D,spawn,qs -c niri ipc call shell toggleCalendar
bind=SUPER+SHIFT,W,spawn,qs -c niri ipc call shell toggleNotes
bind=SUPER+SHIFT,B,spawn,sh -c "exec $HOME/.local/bin/wallpaper-picker"

bind=SUPER,Q,killclient
bind=SUPER,L,spawn,swaylock -f
bind=SUPER,F,togglemaximizescreen
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER,V,togglefloating
bind=SUPER+SHIFT,V,toggle_all_floating
bind=SUPER,M,minimized
bind=SUPER+SHIFT,M,restore_minimized
bind=SUPER,O,toggleoverview
bind=SUPER+SHIFT,E,quit
bind=SUPER+SHIFT,P,sleep_monitor,eDP-1

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

bind=SUPER+CTRL,Up,movewin,+0,-50
bind=SUPER+CTRL,Down,movewin,+0,+50
bind=SUPER+SHIFT,H,resizewin,-50,+0
bind=SUPER+SHIFT,L,resizewin,+50,+0
bind=SUPER+SHIFT,K,resizewin,+0,-50
bind=SUPER+SHIFT,J,resizewin,+0,+50

bind=SUPER,R,switch_layout
bind=SUPER+SHIFT,R,dwindle_toggle_split_direction
bind=SUPER+SHIFT,Return,dwindle_toggle_split_direction
bind=SUPER+CTRL,R,setlayout,dwindle

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER,Tab,view,-1,0
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,U,viewtoleft,0
bind=SUPER,I,viewtoright,0

axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

bind=SUPER+CTRL,Left,tagtoleft,0
bind=SUPER+CTRL,Right,tagtoright,0
bind=SUPER,BracketLeft,move_client,left
bind=SUPER,BracketRight,move_client,right
bind=SUPER,Comma,groupjoin,left
bind=SUPER,Period,groupleave

bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.5
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +5%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 5%-

bind=NONE,Print,spawn_shell,$HOME/.local/bin/screenshot-region
bind=SUPER,Print,spawn_shell,grim - | wl-copy
bind=SHIFT,Print,spawn_shell,grim "$HOME/Pictures/Screenshots/Screenshot-$(date +%Y%m%d-%H%M%S).png"

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=NONE,btn_middle,togglemaximizescreen

gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# Terminals: no slide. The window is already painted (~55 ms) and the 180 ms
# slide just reads as "still loading". Scoped to these app_ids only.
window_rule=animation_type_open:none,app_id:stride
window_rule=animation_type_close:none,app_id:stride
window_rule=animation_type_open:none,app_id:foot
window_rule=animation_type_close:none,app_id:foot
